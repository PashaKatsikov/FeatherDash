name: featherdash
description: "Feather Dash - chicken basketball game."
publish_to: 'none'

version: 1.0.1+10

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.11.0
  http: ^1.4.0
  url_launcher: ^6.3.2
  connectivity_plus: ^6.1.0
  device_info_plus: ^11.3.0
  package_info_plus: ^8.3.0
  flutter_secure_storage: ^9.2.4
  # PINNED. Do NOT upgrade to 10.x+ — those releases are Kotlin-only
  # and ship their own Kotlin Gradle Plugin that clashes with Flutter's
  # built-in Kotlin support, breaking `GeneratedPluginRegistrant.java`.
  # See `.cursor/rules/gray_part_pitfalls.md` §1.
  file_picker: 8.1.4
  appsflyer_sdk: ^6.15.0
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.0
  firebase_app_check: ^0.3.2+5
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  # Dark navy frame — complements the warm tones in the chicken art
  # and makes the icon read clearly against light home-screen wallpapers.
  adaptive_icon_background: "#1B2A4A"
  adaptive_icon_foreground: "assets/icon.png"
  # 18% inset keeps the foreground entirely inside Android's 66dp safe
  # zone of the 108dp adaptive canvas, so no part of the chicken is
  # clipped by circular / squircle / teardrop launcher masks.
  adaptive_icon_foreground_inset: 18
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/loading_screen_horizontal.webp
    - assets/loading_screen_portrait.webp
    - assets/basketball_court1.webp
    - assets/basketball_court2.webp
    - assets/basketball_court3.webp
    - assets/basketball_pole.webp
    - assets/ball_pump.webp
    - assets/ball_pump2.webp
    - assets/usual_chicken_defolt.webp
    - assets/usual_chicken_skin.webp
    - assets/usual_chicken_skin2.webp
    - assets/usual_chicken_skin3.webp
    - assets/slightly_puffed-up_chicken_defolt.webp
    - assets/slightly_puffed-up_chicken_skin.webp
    - assets/slightly_puffed-up_chicken_skin2.webp
    - assets/slightly_puffed-up_chicken_skin3.webp
    - assets/puffed_up_chicken_defolt.webp
    - assets/puffed_up_chicken_skin.webp
    - assets/puffed_up_chicken_skin2.webp
    - assets/puffed_up_chicken_skin3.webp
    - assets/exploded_defolt_chicken.webp
    - assets/exploded_chicken_skin.webp
    - assets/exploded_chicken_skin2.webp
    - assets/exploded_chicken_skin3.webp
    - assets/additional_assets/notifications_horizantal.webp
    - assets/additional_assets/notifications_portrait.webp
    - assets/additional_assets/nowifi_horizontal.webp
    - assets/additional_assets/nowifi_portrait.webp
